<header class="site-header">

            TradMusic

        <nav class="site-nav" aria-label="Main">

                <li><a class="site-nav__link" href="musicians.html">Musicians</a></li>

                <li><a class="site-nav__link" href="about.html">About</a></li>
            </ul>
        </nav>
        <div class="site-header__account">
            <details class="user-menu">
                <summary class="user-menu__toggle">
                    <img src="assets/images/placeholder-musician.svg" alt="">
                    <span class="user-menu__name">Gráinne Kelly</span>
                </summary>
                <ul class="user-menu__list">
                    <li class="user-menu__heading">Venue manager</li>

                </ul>
            </details>
        </div>
    </div>
</header>

<main>

<div class="container">
    <header class="page-header">
        <p class="page-header__eyebrow">The Crooked Bow</p>
        <h1>Edit session</h1>
    </header>

    <div class="form-panel">
        <form name="session" method="post">
            <div id="session">
                <div>
                    <label for="session_name" class="required">Name</label>
                    <input type="text" id="session_name" name="session[name]" required="required" value="Slow Session for Learners">
                </div>
                <div>
                    <label for="session_dayOfWeek" class="required">Day of the week</label>
                    <select id="session_dayOfWeek" name="session[dayOfWeek]" required="required">
                        <option value="">Choose a day</option>
                        <option value="1">Monday</option>
                        <option value="2" selected="selected">Tuesday</option>
                        <option value="3">Wednesday</option>
                        <option value="4">Thursday</option>
                        <option value="5">Friday</option>
                        <option value="6">Saturday</option>
                        <option value="7">Sunday</option>
                    </select>
                </div>
                <div>
                    <label for="session_startsAt" class="required">Time</label>
                    <input type="time" id="session_startsAt" name="session[startsAt]" required="required" value="19:30">
                </div>
                <div><button type="submit" id="session_submit" name="session[submit]">Save</button></div>
                <input type="hidden" id="session__token" name="session[_token]" value="csrf-token">
            </div>
        </form>
    </div>
</div>
</main>
