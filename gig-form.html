    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="assets/styles/app.css">
</head>
<body>

<header class="site-header">
    <div class="container site-header__inner">
        <a class="site-header__brand" href="index.html">
            <img src="assets/images/logo.svg" alt="" width="40" height="40">
            TradMusic
        </a>
        <nav class="site-nav" aria-label="Main">
            <ul class="site-nav__list">
                <li><a class="site-nav__link" href="musicians.html">Musicians</a></li>
                <li><a class="site-nav__link" href="gigs.html">Gigs</a></li>
                <li><a class="site-nav__link" href="venues.html">Venues</a></li>
                <li><a class="site-nav__link" href="about.html">About</a></li>
            </ul>
        </nav>
        <div class="site-header__account">
            <details class="user-menu">
                <summary class="user-menu__toggle">
                    <img src="assets/images/placeholder-musician.svg" alt="">
                    <span class="user-menu__name">Gráinne Kelly</span>
                </summary>
                <ul class="user-menu__list">
                    <li class="user-menu__heading">Venue manager</li>
                    <li><a class="user-menu__link" href="my-venues.html">My venues</a></li>
                    <li><a class="user-menu__link" href="join-requests.html">Join requests <span class="badge badge--count" aria-label="2 pending">2</span></a></li>
                    <li class="user-menu__separator"><a class="user-menu__link" href="index.html"><span>Log out</span><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i></a></li>
                </ul>
            </details>
        </div>
    </div>
</header>

<main>

<div class="container">
    <header class="page-header">
        <p class="page-header__eyebrow">The Crooked Bow</p>
        <h1>Edit gig of Fri 16 Oct</h1>
    </header>

    <div class="form-panel">
        <form name="gig" method="post">
            <div id="gig">
                <div>
                    <label for="gig_startsAt" class="required">Date and time</label>
                    <input type="datetime-local" id="gig_startsAt" name="gig[startsAt]" required="required" value="2026-10-16T21:00">
                </div>
                <div>
                    <label>Lineup</label>
                    <div id="gig_lineup">
                        <input type="checkbox" id="gig_lineup_0" name="gig[lineup][]" value="1" checked="checked"><label for="gig_lineup_0">Aoife Brennan</label>
                        <input type="checkbox" id="gig_lineup_1" name="gig[lineup][]" value="2"><label for="gig_lineup_1">Niamh Doherty</label>
                        <input type="checkbox" id="gig_lineup_2" name="gig[lineup][]" value="3"><label for="gig_lineup_2">Owen Doyle</label>
                        <input type="checkbox" id="gig_lineup_3" name="gig[lineup][]" value="4"><label for="gig_lineup_3">Declan Farrell</label>
                        <input type="checkbox" id="gig_lineup_4" name="gig[lineup][]" value="5" checked="checked"><label for="gig_lineup_4">Ronan Keane</label>
                        <input type="checkbox" id="gig_lineup_5" name="gig[lineup][]" value="6"><label for="gig_lineup_5">Pádraig Lynch</label>
                        <input type="checkbox" id="gig_lineup_6" name="gig[lineup][]" value="7"><label for="gig_lineup_6">Siobhán Murphy</label>
                        <input type="checkbox" id="gig_lineup_7" name="gig[lineup][]" value="8"><label for="gig_lineup_7">Clodagh Nolan</label>
                        <input type="checkbox" id="gig_lineup_8" name="gig[lineup][]" value="9"><label for="gig_lineup_8">Máire Quinlan</label>
                        <input type="checkbox" id="gig_lineup_9" name="gig[lineup][]" value="10"><label for="gig_lineup_9">Cillian Walsh</label>
                    </div>
                </div>
                <div>
                    <label for="gig_description">Description</label>
                    <textarea id="gig_description" name="gig[description]">Aoife and Ronan open the weekend with a set of Connemara reels and slides.</textarea>
                </div>
                <div><button type="submit" id="gig_submit" name="gig[submit]">Save</button></div>
                <input type="hidden" id="gig__token" name="gig[_token]" value="csrf-token">
            </div>
        </form>
    </div>
</div>
</main>

<footer class="site-footer">
    <div class="container site-footer__inner">
        <p>TradMusic &copy; 2026 — Irish traditional music, live.</p>

            <li><a href="gigs.html">Gigs</a></li>
            <li><a href="venues.html">Venues</a></li>
        </ul>
    </div>
</footer>

</body>
</html>
